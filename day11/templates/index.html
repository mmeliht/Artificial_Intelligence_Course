<html>
<head>
<meta charset='utf-8'>
<title> Maas Tahmin Eden Yapay Zeka Modeli</title>
</head>
<body>
<h1> Maaş Tahmini Yapan Model</h1>
<form action="/predict" method="post">
    <table>
        <tr>
            <td>Isim</td><td> <input type="text" name="isim"></td>
        </tr>
        <tr>
            <td>Tecrübe:</td>
            <td><input type="text" name="tecrube" required></td>
        </tr>
        <tr>
            <td>Yazılı sınav notu:</td>
            <td><input type="text" name="yazili" required></td>
        </tr>
        <tr>
            <td>Mülakat sınav notu:</td>
            <td><input type="text" name="mulakat" required></td>
        </tr>
        <tr>
            <td></td>
            <td> <button type="submit">Tahmin Et</button> <button type="reset">Temizle</button> </td>
        </tr>
    </table>
</form>
{{tahmin}}
</body>
</html>
